(function () {
  try {
    var 칸 = document.getElementById('klmUnseList');
    if (!칸 || !window.fetch || !window.DOMParser) return;
    var 길 = '/news/articleList.html?sc_section_code=S1N29&sc_sub_section_code=S2N157&view_type=sm';
    fetch(길, { credentials: 'same-origin' }).then(function (r) {
      if (!r.ok) throw new Error('목록을 못 받았다');
      return r.text();
    }).then(function (글) {
      var 쪽 = new DOMParser().parseFromString(글, 'text/html');
      var 본것 = {};
      var 모음 = [];
      ['#skin-listTop', '#section-list'].forEach(function (이름) {
        var c = 쪽.querySelector(이름);
        if (!c) return;
        c.querySelectorAll('a[href*="articleView.html?idxno="]').forEach(function (a) {
          var m = (a.getAttribute('href') || '').match(/idxno=(\d+)/);
          if (!m || 본것[m[1]]) return;
          var 제 = a.querySelector('.auto-titles');
          var t = ((제 ? 제.textContent : a.textContent) || '').trim().replace(/\s+/g, ' ');
          if (!t || t.length < 4) return;
          본것[m[1]] = 1;
          모음.push({ 번호: m[1], 제목: t });
        });
      });
      if (모음.length < 4) return;              /* 모자라면 그대로 둔다 */
      모음.sort(function (가, 나) { return Number(나.번호) - Number(가.번호); });
      var 줄 = '';
      모음.slice(0, 4).forEach(function (x) {
        var 안전 = x.제목.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        줄 += '<li><a href="/news/articleView.html?idxno=' + x.번호 + '">'
            + '<span class="klm-t">' + 안전 + '</span></a></li>';
      });
      칸.innerHTML = 줄;
    }).catch(function () { /* 조용히 넘어간다 */ });
  } catch (e) { /* 조용히 넘어간다 */ }
})();
</script>
