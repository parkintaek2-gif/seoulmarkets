# seoulmarkets — Cloudtype 배포 설정
#
# 이 앱은 Astro 정적 빌드 결과(dist/)를 server.mjs 가 서비스하는 구조다.
# 서버 로직도 DB도 없고, 런타임 의존성은 0개다(내장 모듈만 사용).
#
# [1] start 는 `npm start` = `node server.mjs`.
#     server.mjs 가 PORT 환경변수를 읽으므로 아래 ports 와 자동으로 맞는다.
#     ⚠ Cloudflare/GitHub Pages 와 달리 일반 Node 호스팅은 `/equities` → `equities.html`
#     을 알아서 처리하지 않는다. server.mjs 가 그 일을 한다. 지우면 전 페이지가 404 다.
#
# [2] 환경변수 — **이름만 적는다. 값은 절대 적지 않는다.**
#     이 저장소는 공개다. `secret:` 속성은 배포환경(스테이지)에 미리 저장해 둔
#     시크릿을 **이름으로 참조**하는 것이라 값이 파일에 남지 않는다.
#     (형식 출처: https://docs.cloudtype.io/guide/references/env)
#
#     값을 넣는 방법 — 저장소에 안 남는다:
#       node <ctype.js 경로> stage secret ARCHIVE_S3_SECRET <값> -t @parkintaek2/seoulmarkets:main
#     ⚠ `ctype stage secret` 은 **설정한 값을 그대로 되돌려 출력한다.** 로그에 남기지 말 것.
#     ⚠ `ctype ls -o json` 은 환경변수를 통째로 뱉는다. 2026-08-01 에 키가 세 번 샜고
#       그래서 지금은 권한 deny 목록에 올라가 있다. 쓰지 말 것.
#
# [2-1] ⚠ 이 env 블록이 왜 필요했나 (2026-08-02 KST)
#     `/v1/research` 가 66,071건을 갖고도 「0건」이었다. 원인이 두 겹이었는데
#     두 번째가 이것이다 — **스테이지에 시크릿을 저장해도 자동 주입되지 않는다.**
#     `ctype stage secret` 만 하고 배포했더니 `credentials_present:false` 그대로였다.
#     저장(stage secret)과 주입(이 블록)은 별개다. 둘 다 해야 한다.
#
# [3] build 는 `npm run build` 로 dist/ 를 만든다.
#     dist/ 는 .gitignore 에 있어 저장소에 없으므로 빌드 단계가 반드시 필요하다.
#
# [4] 저장소가 공개이므로 Cloudtype 이 GitHub App 저장소 권한 없이 그대로 clone 한다.
#     (처음에 비공개로 만들었을 때 이게 막혔었다)
#
# [5] 메모리 — 실행은 512MB 로 차고 넘친다(정적 파일 서빙, 의존성 0개).
#     다만 **빌드 단계**는 Astro+Vite 가 도므로 더 먹는다. 기사 4,000건 로컬 빌드가
#     102초였다. 빌드가 OOM 으로 죽으면 메모리를 잠깐 올렸다가 되돌리면 된다.

name: web
app: node
preset: node

options:
  ports: 3000
  nodeversion: 22
  install: npm ci
  build: npm run build
  start: npm start

  # R2(아카이브 저장소) 자격증명. **이름만** — 값은 스테이지 시크릿에 있다. 위 [2] 참조.
  # 이게 없으면 컨테이너가 아카이브를 못 읽는다. 컨테이너에는 영구 디스크가 없어서
  # `archive/` 가 아예 존재하지 않기 때문이다.
  env:
    - name: ARCHIVE_S3_ENDPOINT
      secret: ARCHIVE_S3_ENDPOINT
    - name: ARCHIVE_S3_BUCKET
      secret: ARCHIVE_S3_BUCKET
    - name: ARCHIVE_S3_KEY_ID
      secret: ARCHIVE_S3_KEY_ID
    - name: ARCHIVE_S3_SECRET
      secret: ARCHIVE_S3_SECRET
    - name: ARCHIVE_S3_REGION
      secret: ARCHIVE_S3_REGION

    # RapidAPI 를 거친 요청인지 가리는 비밀값. **이름만** — 값은 스테이지 시크릿에 있다.
    #
    # ⚠ 이게 주입되지 않으면 **유료 구매자도 무료와 똑같이 1회 200건만 받는다.**
    #   코드(src/lib/tiers.mjs)는 비밀값이 없으면 아무도 pro 로 안 올린다 —
    #   기본이 닫힘이라 그렇다. 반대로 하면 유료화가 통째로 뚫린다.
    #   구매자가 곧바로 환불을 요구할 자리이므로 지우지 말 것.
    - name: RAPIDAPI_PROXY_SECRET
      secret: RAPIDAPI_PROXY_SECRET

    # 🔴 [2026-09-13] 페이팔 — 이것이 없으면 /data 의 결제가 통째로 죽는다.
    #   서버는 PAYPAL_MODE 가 'live' 일 때만 진짜 돈을 받는다(src/lib/paypal.mjs 진짜돈인가).
    #   ⛔ 값을 여기 적지 않는다. 이름만 적고 값은 스테이지 시크릿에 있다.
    #   ⚠ 순서 — 스테이지에 시크릿을 «먼저» 넣고 이 줄을 적는다.
    #     없는 시크릿을 적으면 배포가 Starting 에서 멈춘다(아래 KDI 사고와 같은 함정).
    #     2026-09-13 에 셋을 먼저 넣은 것을 확인하고 이 줄을 적었다.
    - name: PAYPAL_CLIENT_ID
      secret: PAYPAL_CLIENT_ID
    - name: PAYPAL_SECRET
      secret: PAYPAL_SECRET
    - name: PAYPAL_MODE
      secret: PAYPAL_MODE

    # 🔴 KDI Open API 인증키 — **여기 미리 적어 두면 안 된다.** 지웠다.
    #
    # 2026-08-03 20:08 에 `- name: KDI_API_KEY / secret: KDI_API_KEY` 를 넣었다.
    # 키를 아직 안 받았으니 **스테이지에 그 시크릿이 없는 상태**였다.
    # 그때부터 **모든 배포가 Starting 에서 멈췄다** — 21:26 · 23:38 · 23:4x 세 번.
    # 없는 시크릿을 주입하려다 컨테이너가 못 뜬 것이다.
    #
    # ⚠ 처음엔 klifemap 과의 메모리 충돌인 줄 알았다. 실제로 두 번 겹치기도 했다.
    #   그래서 원인을 3시간 늦게 찾았다. **겹침은 사실이었지만 원인은 아니었다.**
    #   증상이 그럴듯하다고 첫 가설을 붙들지 말 것.
    #
    # 키가 오면 **먼저 스테이지에 시크릿을 만들고**(ctype stage secret) 그 다음에
    # 아래 두 줄을 되살린다. 순서를 바꾸면 사이트가 안 뜬다.
    #
    #   - name: KDI_API_KEY
    #     secret: KDI_API_KEY
    #
    # 키가 없어도 수집기는 「아직 없다」고 말하고 정상 종료한다(scripts/collect-kdi.mjs).
    # 그래서 이 줄이 없다고 잃는 것은 없다.

# 프리티어(spot) 리소스로 뜨면 매일 1회 자동 중지된다 — 매체로는 못 쓴다.
# 유료(Hobby) 리소스로 고정한다.
resources:
  spot: false
  # 런타임 실측 47.6MB. 의존성 0개 정적 서버라 0.25GB 로 충분하다.
  # 남는 몫은 같은 계정의 klifemap 이 쓴다.
  #
  # [2026-08-01] 「우리 몫을 쪼개 신규 사이트에 나누라」는 지시로 0.125 를 시도했다.
  #   → **Cloudtype 은 메모리를 0.25 단위로만 받는다.** ("memory is only allowed
  #      in increments of 0.25") 0.25 가 바닥이라 더 쪼갤 수 없다. 이 줄은 못 내린다.
  #
  #   ⚠ `ctype apply -p`(prepare) 는 이 오류를 **잡아내지 못했다.** 성공한 것처럼
  #      "deployed" 를 출력한다. -p 를 검증 수단으로 믿지 말 것 — 실제 apply 만이 검증이다.
  #
  # 🔴 2026-08-04 00:0x KST — **0.25 → 0.5 로 올린다.**
  #   20:08 이후 배포가 세 번 연속 Starting 에서 멈췄다. 원인을 두 번 잘못 짚었다.
  #     ① klifemap 과의 메모리 충돌 → 겹친 건 사실이지만, klifemap 이 Running 인
  #        10분 동안에도 우리만 Starting 이었다. 공유 자원 탓이 아니었다
  #     ② 없는 시크릿(KDI_API_KEY) 참조 → 지워도 그대로 멈췄다
  #   남은 것은 위 [5] 에 이미 적혀 있던 것이다 — **빌드 단계 OOM.**
  #   컨테이너가 `npm ci` + Astro/Vite 빌드를 직접 하는데 0.25GB 로는 모자란다.
  #   오늘 지면이 17 → 19쪽으로 늘면서 선을 넘은 것으로 본다.
  #   런타임은 여전히 47.6MB 다. **이 0.5 는 빌드를 위한 것이다.**
  memory: 0.5

context:
  git:
    url: https://github.com/parkintaek2-gif/seoulmarkets.git
    branch: main

# 재빌드 표식 — 2026-08-04 17:4x KST
# ⚠ 이 줄은 **의미가 없다.** Cloudtype 이 app.yaml 이 그대로면 이전 이미지를 재사용하는지
#   확인하려고 넣었다. 17:28·17:32 두 번의 apply 가 20초 만에 Running 이 됐는데
#   새 기사가 404 였다 — 다시 빌드하지 않았다는 뜻이다.
#   이 표식이 있는데도 옛 내용이 나오면 원인은 캐시가 아니다.
#
# 🔴 [2026-09-09 17:5x · 5번] **위 줄이 남긴 물음에 답이 나왔다 — 원인은 「빌드가 죽은 것」이다.**
#
#   증상이 위와 똑같았다. apply 를 세 번 걸었고 세 번 다 «1.5분 만에» Running 이 되면서
#   새 지면이 404 였다. 지면 8,277장 빌드가 로컬에서 2분 3초인데 그보다 빨랐다.
#
#   ⛔ 원인을 처음에 「롤링 업데이트에 두 배 메모리가 필요한데 여유가 없다」로 짚었다.
#     그것도 이 문서에 적힌 «실제» 함정이지만 이번 원인이 아니었다.
#   ✅ 진짜 원인 — **지면이 import 하는 파일을 커밋에 안 넣었다.**
#     `/data/mezzanine` 지면만 커밋하고 `src/data/seoulmarkets-mezzanine.json` 을 뺐다.
#     Cloudtype 은 저장소를 clone 해서 빌드하므로 없는 모듈에서 죽고,
#     **옛 컨테이너가 Running 으로 계속 돈다.** 그래서 성공처럼 보인다.
#   ⇒ 그리고 이것은 «내 지면만» 막지 않는다. 그 뒤 모든 배포가 안 나간다 —
#     그날 다른 유닛이 낸 홈 링크도 같이 막혀 있었다.
#
#   ⭐ 가르는 법 (다음 세션은 이 한 줄로 판정한다)
#     ctype ls -t @parkintaek2/seoulmarkets:main 에서 STATUS 를 본다.
#       Building 이 «몇 분» 이어진다      → 진짜 빌드 중이다. 기다린다
#       Running 인데 1~2분 만에 UPDATED   → **빌드가 죽었다.** 메모리가 아니라 코드를 본다
#     그 다음: node scripts/check-imports-committed.mjs  ← 이 갈래를 코드로 잡는다
#
#   ⛔ 「내 컴퓨터에서 npm run build 가 됐다」는 배포가 된다는 뜻이 아니다.
#     내 작업트리에는 그 파일이 있다. **커밋된 것만이 배포된다.**
